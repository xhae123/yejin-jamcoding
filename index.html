<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>yejin-jamcoding</title>
</head>
<body>

  <h1>yejin-jamcoding 과제 모음</h1>

  <p>주소 끝에 <code>?week=숫자</code>를 붙이면 해당 주차 과제로 이동합니다.</p>
  <p>예시 : <a href="?week=1">?week=1</a> → week-1 과제로 이동</p>

  <script>
    // 주소창의 ?week=숫자 값을 읽어온다
    const params = new URLSearchParams(window.location.search);
    const week = params.get("week");

    // week 값이 있으면 해당 주차 폴더의 index.html로 이동한다
    if (week) {
      window.location.href = "week-" + week + "/index.html";
    }
  </script>

</body>
</html>
