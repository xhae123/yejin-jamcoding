<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>week-1 과제 - 상품 상세 페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- 상단 : 브랜드명 + 아이콘 -->
    <div class="top-bar">
      <p class="brand">아누아 &gt;</p>
      <div class="top-icons">
        <span class="icon-box">찜하기</span>
        <span class="icon-box">공유</span>
      </div>
    </div>

    <!-- 상품명 -->
    <h1 class="title">
      [수지세럼] 아누아 피디알엔 히알루론산 캡슐 100 세럼 30mL 기획 (+30mL 리필팩)
    </h1>

    <!-- 가격 정보 -->
    <div class="price-box">
      <p class="original-price">58,500원</p>
      <p class="sale-price">
        <span class="discount">52%</span>
        27,500<span class="won">원</span>
        <span class="info-icon">i</span>
      </p>
      <p class="unit-price">(10ml당 4,583원)</p>
    </div>

    <!-- 배지 -->
    <p class="badge">오늘드림</p>

    <!-- 리뷰 -->
    <div class="review-box">
      <span class="rating">★ 4.8</span>
      <span class="line">|</span>
      <span class="review-count">리뷰 12,864건</span>
      <span class="photo">사진</span>
      <span class="photo photo-more">+</span>
    </div>

    <!-- 조회수 -->
    <p class="viewers">113명이 보고 있어요</p>

    <!-- 수량 선택 + 가격 -->
    <div class="order-box">
      <div class="quantity">
        <button class="qty-btn">-</button>
        <span class="qty-num">1</span>
        <button class="qty-btn">+</button>
      </div>
      <p class="order-price">27,500원</p>
    </div>

    <!-- 총 결제 금액 -->
    <div class="total-box">
      <p class="total-label">구매수량 <strong>1개</strong></p>
      <p class="total-price">총 27,500원</p>
    </div>

  </div>

</body>
</html>
